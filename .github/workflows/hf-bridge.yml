name: hf-bridge-release-probe

on:
  push:
    paths:
      - '.github/workflows/hf-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Make 1 MiB probe
        shell: bash
        run: |
          set -euo pipefail
          head -c 1048576 /dev/urandom > release-probe.bin
          sha256sum release-probe.bin | tee release-probe.sha256
      - name: Publish temporary release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete hf-bridge-temp --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          gh release create hf-bridge-temp \
            --repo "$GITHUB_REPOSITORY" \
            release-probe.bin release-probe.sha256 \
            --title 'Temporary HF bridge' \
            --notes 'Temporary transfer probe; safe to delete.'
