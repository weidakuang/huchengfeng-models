name: hf-model-release-bridge

on:
  push:
    paths:
      - '.github/workflows/hf-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODEL_URL: https://huggingface.co/empero-ai/Qwen3.8-4B-Distill-GGUF/resolve/main/Qwen3.8-4B-Q4_K_M.gguf?download=true
      MODEL_FILE: Qwen3.8-4B-Q4_K_M.gguf
      RELEASE_TAG: qwen38-bridge
    steps:
      - name: Restore model cache
        id: model-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL_FILE }}
          key: qwen38-4b-q4km-v1

      - name: Download model from Hugging Face
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 8 --retry-delay 3 --retry-all-errors --connect-timeout 30 -o "$MODEL_FILE" "$MODEL_URL"

      - name: Verify and split model
        shell: bash
        run: |
          set -euo pipefail
          test -s "$MODEL_FILE"
          sha256sum "$MODEL_FILE" | tee model.sha256
          stat -c 'MODEL_SIZE=%s' "$MODEL_FILE" | tee model.size
          split -b 450M -d -a 2 "$MODEL_FILE" "$MODEL_FILE.part"
          sha256sum "$MODEL_FILE".part* | tee parts.sha256
          ls -lh "$MODEL_FILE".part*
          test "$(find . -maxdepth 1 -name "$MODEL_FILE.part*" | wc -l)" -eq 6

      - name: Publish temporary release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete "$RELEASE_TAG" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create "$RELEASE_TAG" \
            "$MODEL_FILE".part00 \
            "$MODEL_FILE".part01 \
            "$MODEL_FILE".part02 \
            "$MODEL_FILE".part03 \
            "$MODEL_FILE".part04 \
            "$MODEL_FILE".part05 \
            model.sha256 model.size parts.sha256 \
            --title "Temporary Qwen3.8 4B Q4_K_M bridge" \
            --notes "Temporary transfer assets for assembling Qwen3.8-4B-Q4_K_M.gguf."
